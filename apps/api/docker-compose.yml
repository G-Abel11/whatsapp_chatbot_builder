services:
  postgres:
    image: postgres:16-alpine
    container_name: opes-postgres
    environment:
      POSTGRES_USER: opes
      POSTGRES_PASSWORD: opes
      POSTGRES_DB: opes
    ports:
      - "5432:5432"
    volumes:
      - opes-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opes"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: opes-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - opes-redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  opes-postgres:
  opes-redis:
